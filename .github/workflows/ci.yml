# Continuous integration.
#
# Ordered cheapest-first so a formatting mistake fails in seconds rather than after the test
# suite. The jobs that can run in parallel do; the ones that gate deployment do not start
# until everything they depend on has passed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Individual jobs widen this only where they must — the image
# build needs `packages: write`, and nothing else does.
permissions:
  contents: read

concurrency:
  # Cancel superseded runs on a branch, but never on main: a cancelled main run leaves no
  # record of whether that commit was ever green.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.11"

jobs:
  static:
    name: format · lint · types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyright
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check --output-format=github .
      - name: Type check
        run: pyright

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest tests -q --cov=cip_core --cov=cip_ingestion --cov=cip_retrieval --cov=cip_copilot --cov=cip_platform --cov=cip_gateway --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    # Real backing services. These tests are skipped in the unit job and are the only place
    # the Cypher, Atlas-shaped, and RLS paths actually execute.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cip
        options: >-
          --health-cmd "pg_isready -U cip" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/citestpassword
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 15s --health-timeout 10s --health-retries 10
        ports: ["7687:7687", "7474:7474"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Migrate
        # Nested settings use a double underscore, and there is no `dsn` field to set:
        # PostgresSettings.dsn() *builds* the URL from these parts. `CIP_POSTGRES_DSN` was
        # read by nothing, so migrations ran against the defaults and authenticated as the
        # runner's OS user. Asserted by
        # tests/gateway/test_integration.py::test_ci_environment_variables_are_real_settings.
        env:
          CIP_POSTGRES__HOST: localhost
          CIP_POSTGRES__PORT: "5432"
          CIP_POSTGRES__DATABASE: cip
          CIP_POSTGRES__USER: cip
          CIP_POSTGRES__PASSWORD: ci
        run: python -m cip_ingestion.cli db upgrade
      # Row-level security is bypassed unconditionally by superusers, and FORCE ROW LEVEL
      # SECURITY does not change that. `POSTGRES_USER` creates a superuser, so the RLS tests
      # connected as one and every policy was silently inert — the isolation guarantee the
      # tests exist to prove had never actually been proven.
      #
      # Migrations keep the superuser, because DDL needs it. Everything after runs as a
      # non-superuser role that owns the tables, so FORCE applies to it. That is also the
      # posture production must hold: an application that connects as a superuser has no
      # tenant isolation, whatever its policies say.
      - name: Create the non-superuser application role
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U cip -d cip -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cip_app LOGIN PASSWORD 'ci_app' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO cip_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO cip_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO cip_app;
          DO $$
          DECLARE r record;
          BEGIN
            FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' LOOP
              EXECUTE format('ALTER TABLE public.%I OWNER TO cip_app', r.tablename);
            END LOOP;
          END $$;
          SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = 'cip_app';
          SQL
      - name: Integration tests
        env:
          CIP_RUN_INTEGRATION: "1"
          CIP_POSTGRES__HOST: localhost
          CIP_POSTGRES__PORT: "5432"
          CIP_POSTGRES__DATABASE: cip
          CIP_POSTGRES__USER: cip_app
          CIP_POSTGRES__PASSWORD: ci_app
          # CIP_REDIS_URL is flat: cip_platform reads it directly, unlike the nested
          # cip_core models above. The two conventions coexist and both are correct.
          CIP_REDIS_URL: redis://localhost:6379/0
          CIP_NEO4J__URI: bolt://localhost:7687
          CIP_NEO4J__USER: neo4j
          CIP_NEO4J__PASSWORD: citestpassword
        run: pytest tests -q -m integration

  architecture:
    name: architecture validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The module-boundary and dependency-direction rules. An architectural rule nobody
      # checks is an architectural rule that stops holding, so it is a CI gate rather than a
      # paragraph in an ADR.
      - name: Module boundaries and dependency direction
        run: pytest tests -q -k "ModuleBoundaries or PlatformBoundary or Architecture"

  security:
    name: security · dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit pip-audit
      # Static analysis for common insecure patterns. `-ll` reports medium and high only:
      # low-severity findings on a codebase this size are almost entirely false positives,
      # and a scan nobody reads is a scan that gates nothing.
      - name: Static security analysis
        run: bandit -r libs services -ll -x tests
      - name: Dependency vulnerability scan
        run: |
          # setuptools is a build-time dependency of the runner image, not of this project;
          # upgrading it here fixes PYSEC-2026-3447 without pinning a build tool in
          # pyproject.toml, where it does not belong.
          python -m pip install --upgrade "setuptools>=83.0.0"
          #
          # PYSEC-2026-1325 (ecdsa) has no fix version and is not reachable here. `ecdsa`
          # arrives solely through python-jose, and the vulnerability is a timing side channel
          # in ECDSA *signing* — this platform signs with HS256 and verifies OIDC tokens
          # against a JWKS endpoint, so no ECDSA operation is ever performed.
          #
          # This is a suppression, not a resolution, and the real fix is queued: python-jose
          # has been unmaintained since 2021 and is imported at exactly one site
          # (services/ingestion/.../api/security.py). Replacing it with PyJWT removes the
          # dependency, and with it this exception.
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-1325
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Default rules plus one narrowly-scoped allowlist; see the file for the reasoning.
          GITLEAKS_CONFIG: .gitleaks.toml

  manifests:
    name: manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        uses: instrumenta/kubeval-action@master
        with:
          files: deploy/k8s
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
      # Policy checks the schema cannot express: non-root, dropped capabilities, resource
      # limits, no `latest` tags. A manifest can be perfectly valid YAML and still ship a
      # privileged container.
      - name: Policy checks
        run: python scripts/validate_manifests.py

  build:
    name: build image
    runs-on: ubuntu-latest
    needs: [static, test, architecture, security, manifests]
    permissions:
      contents: read
      packages: write
      id-token: write
      # Required to upload the image scan to code scanning. Without it the upload fails with
      # "Resource not accessible by integration", which reads like a token problem.
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          # Without this, buildx keeps the result in its own cache and never hands it to the
          # Docker daemon — so the scan step below could not find the image it had just built.
          load: true
          tags: cip:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations are OFF here, and deliberately.
          #
          # They attach to the image as a manifest list, which the docker exporter cannot load
          # — so `load: true` and `sbom/provenance: true` are mutually exclusive, and this job
          # needs `load` to hand the image to the scanner. It also never pushes, so any
          # attestation it produced would be built and discarded in the same step.
          #
          # An SBOM and provenance are what make the supply chain auditable: "which version of
          # which library shipped in the image serving on 3 March" has to be answerable after
          # the fact. They belong on the publish path, which does not exist yet — nothing in
          # this repository pushes an image to a registry. Building that path, with signing and
          # attestation, is Phase 9 work.
          sbom: false
          provenance: false
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cip:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # Do not fail on unfixed vulnerabilities: a HIGH with no available patch cannot be
          # actioned, and a permanently-red pipeline is a pipeline people learn to ignore.
          ignore-unfixed: true
      - name: Upload scan
        # `always()` alone tried to upload a file a failed scan never wrote, which turned one
        # failure into two and obscured which was the real one.
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
