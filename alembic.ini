[alembic]
script_location = migrations
prepend_sys_path = libs/cip_core/src:services/ingestion/src
# An explicit ':' rather than 'os': the paths above are relative and POSIX-style, so a
# platform-dependent separator would leave them unsplit on Windows and make `alembic`
# unable to import the application package.
path_separator = :

# The database URL is intentionally absent: it is built from CIP_POSTGRES__* settings in
# migrations/env.py so migrations and the application can never disagree about which
# database they target, and so a password never lands in a committed file.

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
