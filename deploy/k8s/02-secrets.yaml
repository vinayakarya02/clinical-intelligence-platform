# Secret *shape*, not secret values.
#
# This file documents which keys must exist. In a real cluster the values come from an
# ExternalSecret (External Secrets Operator) or a SecretProviderClass (Secrets Store CSI)
# backed by a KMS or Vault, so no secret is ever committed, templated, or visible in
# `kubectl get secret -o yaml` history.
#
# Applying this file as-is creates an empty Secret and every pod will fail its readiness probe
# with a clear "secret not configured" error — which is the intended outcome of forgetting to
# wire the real source.
apiVersion: v1
kind: Secret
metadata:
  name: cip-secrets
  namespace: cip
  annotations:
    cip.io/source: "replace with ExternalSecret or SecretProviderClass before deploying"
type: Opaque
# Each key maps to exactly one environment variable via cip_core.secrets.SECRET_FILE_MAP, and
# every one of those variables is a field the settings models accept. That correspondence is
# asserted by a test, because the previous list was written independently of the settings and
# named three keys — postgres-dsn, api-key-pepper, jwt-public-key — that no field corresponds
# to. They mounted successfully, were read by nothing, and left the real settings on their
# defaults.
stringData:
  postgres-password: ""
  mongo-uri: ""
  neo4j-password: ""
  redis-url: ""
  broker-url: ""
  # HS256 signing secret. Unused when CIP_AUTH__MODE is 'oidc' (the deployed default), where
  # verification keys come from the IdP's JWKS endpoint and are never mounted.
  jwt-secret: ""
  # De-identification salt for the analytics warehouse. Its absence is fatal in production:
  # a known salt makes every pseudonym in the warehouse reversible.
  analytics-salt: ""
