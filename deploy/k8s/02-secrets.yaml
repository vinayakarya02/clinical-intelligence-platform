# Secret *shape*, not secret values.
#
# This file documents which keys must exist. In a real cluster the values come from an
# ExternalSecret (External Secrets Operator) or a SecretProviderClass (Secrets Store CSI)
# backed by a KMS or Vault, so no secret is ever committed, templated, or visible in
# `kubectl get secret -o yaml` history.
#
# Applying this file as-is creates an empty Secret and every pod will fail its readiness probe
# with a clear "secret not configured" error — which is the intended outcome of forgetting to
# wire the real source.
apiVersion: v1
kind: Secret
metadata:
  name: cip-secrets
  namespace: cip
  annotations:
    cip.io/source: "replace with ExternalSecret or SecretProviderClass before deploying"
type: Opaque
stringData:
  postgres-dsn: ""
  mongo-uri: ""
  neo4j-password: ""
  redis-url: ""
  broker-url: ""
  api-key-pepper: ""
  jwt-public-key: ""
