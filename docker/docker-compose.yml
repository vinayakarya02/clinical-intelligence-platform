# Local development stack.
#
# Not a production topology: single replicas, no TLS between services, and default
# credentials that are visible in this file precisely because they must never be real ones.
# Production is the Kubernetes manifests in deploy/k8s.
#
# `docker compose up -d` then `docker compose run --rm api migrate`.

name: cip

# Every name here is read by a settings field. Four of them previously were not:
# CIP_POSTGRES_DSN, CIP_MONGO_URI, CIP_NEO4J_URI, and CIP_NEO4J_USER used a single underscore,
# but the nested models require a double one — and there is no `dsn` field at all, since
# PostgresSettings.dsn() *builds* the URL from these parts. The stack therefore ran on defaults
# while appearing fully configured. This is the same defect the CI workflow carried, found the
# same way; `test_environment_variables_are_actually_read` now covers both files.
x-app-env: &app-env
  CIP_ENVIRONMENT: development
  CIP_CACHE_BACKEND: redis
  CIP_REDIS_URL: redis://redis:6379/0
  # Redis, not Celery — docs/design/adr-0040-redis-task-queue.md. Database 1, so a saturated
  # job queue cannot evict cache entries in database 0.
  CIP_QUEUE_BACKEND: redis
  CIP_BROKER_URL: redis://redis:6379/1
  CIP_EVENTS_BACKEND: kafka
  CIP_EVENTS_BROKER_URL: kafka:9092
  CIP_POSTGRES__HOST: postgres
  CIP_POSTGRES__PORT: "5432"
  CIP_POSTGRES__DATABASE: cip
  CIP_POSTGRES__USER: cip
  CIP_POSTGRES__PASSWORD: devpassword
  CIP_MONGO__URI: mongodb://cip:devpassword@mongo:27017/cip?authSource=admin
  CIP_NEO4J__URI: bolt://neo4j:7687
  CIP_NEO4J__USER: neo4j
  CIP_NEO4J__PASSWORD: devpassword
  CIP_OTLP_ENDPOINT: http://otel-collector:4317

# Host ports on every datastore, added in Phase 9 W6. Only Kafka published one before, so
# `make test-integration` on the host could not reach Postgres, Mongo, Neo4j, or Redis — the
# stack was reachable from inside the compose network and from nowhere else. The integration
# suite was therefore unrunnable locally, which is a large part of why it went unnoticed that
# it was not running in CI either.

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["api"]
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["worker"]
    environment: *app-env
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    # Two replicas locally so idempotency and duplicate delivery are exercised in development
    # rather than discovered in staging.
    deploy:
      replicas: 2

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["scheduler"]
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
    # Exactly one. Two schedulers enqueue every periodic job twice (ADR-0017).
    deploy:
      replicas: 1

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cip
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: cip
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cip -d cip"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: cip
      MONGO_INITDB_ROOT_PASSWORD: devpassword
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/devpassword
      NEO4J_PLUGINS: '["apoc"]'
      # The full-text index the graph store queries must exist before retrieval works.
      NEO4J_db_tx__log_rotation_retention__policy: "100M size"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # maxmemory-policy allkeys-lru: this Redis holds only cache, so evicting under pressure is
    # correct. A Redis that also held queue state would need noeviction, and mixing the two
    # roles in one instance is how a cache eviction silently drops queued work.
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kafka in KRaft mode — no ZooKeeper. One broker is right for local development and wrong
  # for production, where ADR-0026's per-tenant ordering needs partitions across brokers.
  kafka:
    image: bitnami/kafka:3.9.0
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # A single broker cannot replicate, so the offsets topic must not ask for more.
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Pinned like every other image here. A dashboard stack that silently changes version
  # underneath you produces "the graph broke and nobody changed anything".
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: devpassword
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ../observability/grafana:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
  neo4j-data:
